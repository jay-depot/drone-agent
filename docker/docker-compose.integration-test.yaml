# Docker Compose for Swarm Integration Testing
# This configuration provides a full swarm environment for testing
# agent-beacon-coordinator interactions.

services:
  # Echo LLM - deterministic responses for testing
  echo-llm:
    build:
      context: ..
      dockerfile: docker/echo-llm.Dockerfile
    container_name: echo-llm
    ports:
      - '3458:3458'
    environment:
      - PORT=3458
    networks:
      - test-swarm

  # Drone Coordinator - the central coordination layer
  drone-coordinator:
    build:
      context: ..
      dockerfile: docker/drone-coordinator.Dockerfile
    container_name: drone-coordinator
    ports:
      - '3456:3456'
    environment:
      - DB_PATH=/data/coordinator.db
    volumes:
      - coordinator-data:/data
      - coordinator-config:/config
    networks:
      - test-swarm
    depends_on:
      - echo-llm

  # Drone Beacon - the local agent hub
  drone-beacon:
    build:
      context: ..
      dockerfile: docker/drone-beacon.Dockerfile
    container_name: drone-beacon
    ports:
      - '3457:3457'
    environment:
      - COORDINATOR_HOST=drone-coordinator
      - COORDINATOR_PORT=3456
      - COORDINATOR_HTTPS=true
      - DB_PATH=/data/beacon.db
    volumes:
      - beacon-data:/data
      - beacon-config:/config
    networks:
      - test-swarm
    depends_on:
      - drone-coordinator

  # Dummy Agent - controlled testing agent
  # This is a minimal agent for testing agent-beacon interactions
  # It connects to beacon and can be controlled via HTTP
  dummy-agent:
    build:
      context: ..
      dockerfile: docker/dummy-agent.Dockerfile
    container_name: dummy-agent
    ports:
      - '3459:3459'
    environment:
      - BEACON_HOST=drone-beacon
      - BEACON_PORT=3457
      - LLM_PROVIDER=echo
      - LLM_ECHO_URL=http://echo-llm:3458
      - AGENT_ID=dummy-agent-1
    volumes:
      - agent-config:/config
    networks:
      - test-swarm
    depends_on:
      - drone-beacon

  # Test Runner - executes integration tests
  test-runner:
    build:
      context: ..
      dockerfile: docker/test-runner.Dockerfile
    container_name: test-runner
    environment:
      - COORDINATOR_URL=https://drone-coordinator:3456
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - BEACON_URL=http://drone-beacon:3457
      - AGENT_URL=http://dummy-agent:3459
      - ECHO_LLM_URL=http://echo-llm:3458
    volumes:
      - test-results:/results
    networks:
      - test-swarm
    depends_on:
      - drone-coordinator
      - drone-beacon
      - dummy-agent

networks:
  test-swarm:
    driver: bridge

volumes:
  coordinator-data:
  coordinator-config:
  beacon-data:
  beacon-config:
  agent-config:
  test-results:
