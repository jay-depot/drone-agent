packages:
  - drone-agent
  - drone-core
  - drone-beacon
  - drone-coordinator
  - drone-coordinator-ui
  - drone-swarm-common
  - drone-gateway
allowBuilds:
  better-sqlite3: true
  esbuild: true
  node-pty: true
  # tree-sitter grammars are used via their WASM files (web-tree-sitter), so
  # their native node bindings are not needed and their build scripts are
  # intentionally ignored.
  tree-sitter-c: false
  tree-sitter-cpp: false
  tree-sitter-go: false
  tree-sitter-java: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
