packages:
  - drone-agent
  - drone-core
  - drone-beacon
  - drone-coordinator
  - drone-coordinator-ui
  - drone-swarm-common
  - drone-swarm
  - drone-gateway
allowBuilds:
  better-sqlite3: true
  esbuild: true
  node-pty: true
  # tree-sitter grammars are used via their WASM files (web-tree-sitter), so
  # their native node bindings are not needed and their build scripts are
  # intentionally ignored.
  tree-sitter-c: false
  tree-sitter-cpp: false
  tree-sitter-go: false
  tree-sitter-java: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
overrides:
  browserslist: ^4.28.7
  qs: ^6.16.0
  # Security audit overrides (fix/2026-10-08-deps-update). All of these are
  # transitive pins the lockfile refused to re-resolve even though every parent
  # range already allows the patched version. Each entry states the vulnerable
  # installed version and the advisory floor it satisfies.
  proxy-addr: ^2.0.8
  undici: ^7.29.1
  # brace-expansion has two in-tree major lines (minimatch@3 needs ^1.x,
  # minimatch@10 needs ^5.x); a bare override would downgrade one of them.
  'brace-expansion@<2': ^1.1.21
  'brace-expansion@>=5': ^5.0.12
  source-map-js: ^1.2.2
  ip-address: ^10.7.1
  hono: ^4.13.7
  postcss-selector-parser: ^7.1.6
  '@modelcontextprotocol/sdk': ^1.31.0

# GHSA-vfj7-8cjw-p6xm (braces stack exhaustion) has no fixed release yet: the
# advisory floor is 3.0.4 but the registry's latest is still 3.0.3, so no
# override can clear it. Kept out of the audit gate until upstream ships.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
